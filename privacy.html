function render(lang){

  var html = '<h1>'+d.title+'</h1><p class="lead">'+d.lead+'</p>';

    if(!row[0]) return '<div style="margin-top:8px">'+row[1]+'</div>';
    return '<h2>'+row[0]+'</h2><div>'+row[1]+'</div>';
  }).join("")+'</div>';
  document.getElementById("doc").innerHTML = html;
  var n = NAV[lang] || NAV.en;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var k = el.getAttribute("data-i18n").replace("nav_","");
    if(n[k]) el.textContent = n[k];
  });
  document.querySelectorAll("#langs button").forEach(function(b){
    b.classList.toggle("on", b.dataset.lang === lang);
  });
}
